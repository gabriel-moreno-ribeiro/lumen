name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ocaml-nox
      - run: ocamlopt -version
      - run: make test
      - run: make examples
      - run: printf 'let x = 21;\nx * 2\n' | ./bin/lumen | grep -q 42
